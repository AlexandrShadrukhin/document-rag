[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-rag"
version = "0.1.0"
description = "Transparent local hybrid RAG for Russian PDF and TXT documents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mwparserfromhell>=0.6.6,<1",
  "numpy>=1.26,<3",
  "psutil>=6,<8",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pymupdf>=1.24,<2",
  "qdrant-client>=1.12,<2",
  "reportlab>=4.2,<5",
  "sentence-transformers>=3.3,<6",
  "tqdm>=4.66,<5",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires local models and a persistent index"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
